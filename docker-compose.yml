services:
  yuejian:
    build: .
    container_name: yuejian
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATA_DIR: /data
      SESSION_DAYS: ${SESSION_DAYS:-30}
      BAIDU_MAP_SERVER_AK: ${BAIDU_MAP_SERVER_AK:-}
      BAIDU_MAP_BROWSER_AK: ${BAIDU_MAP_BROWSER_AK:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - yuejian-data:/data

volumes:
  yuejian-data:
